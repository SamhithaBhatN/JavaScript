<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Day 14</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin:40px;
        }

        input{
            display:block;
            margin-bottom:15px;
            padding:10px;
            width:250px;
        }

        button{
            padding:10px 20px;
        }

        #message{
            margin-top:20px;
            color:red;
            font-weight:bold;
        }

    </style>

</head>
<body>

<h1>JavaScript Forms</h1>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Enter Username">

<input
type="password"
id="password"
placeholder="Enter Password">

<button id="btn" type="submit">
Submit
</button>

</form>

<p id="message"></p>

<script src="script.js"></script>

</body>
</html>
